name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --all-extras --python 3.11

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=src --cov-report=term-missing

      - name: Run linter
        run: uv run ruff check src/

      - name: Run type checker
        run: uv run mypy src/

      - name: Build and verify release artifacts
        run: scripts/release-preflight.sh --tag "${GITHUB_REF_NAME#v}" dist

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pixel-detector-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@v4
        with:
          name: pixel-detector-${{ github.ref_name }}
          path: dist/

      - name: Create GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
