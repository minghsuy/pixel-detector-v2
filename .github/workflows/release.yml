name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.28"
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --all-extras --python 3.11 --locked

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Run tests with coverage
        run: uv run pytest tests/ --cov=src --cov-report=term-missing

      - name: Run linter
        run: uv run ruff check src/

      - name: Run type checker
        run: uv run mypy src/

      - name: Build and verify release artifacts
        run: scripts/release-preflight.sh --tag "${GITHUB_REF_NAME#v}" dist

      - name: Upload verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel-detector-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download verified artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pixel-detector-${{ github.ref_name }}
          path: dist/

      - name: Create GitHub Release for verified commit
        run: |
          git fetch --no-tags origin \
            "+refs/tags/${GITHUB_REF_NAME}:refs/release-tags/current"
          current_commit="$(git rev-list -n 1 refs/release-tags/current)"
          if [[ "$current_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "error: release tag moved from $EXPECTED_COMMIT to $current_commit" >&2
            exit 1
          fi

          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
